name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-quality:
    name: Backend quality checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: kalonet
          POSTGRES_USER: kalonet
          POSTGRES_PASSWORD: kalonet_local_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kalonet -d kalonet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      KALONET_DATABASE_URL: postgresql+psycopg://kalonet:kalonet_local_password@localhost:5433/kalonet

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run lint checks
        run: uv run ruff check .

      - name: Run type checks
        run: uv run mypy

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest